<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlassTransfer sender</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; color: #111;
               font: 14px/1.4 system-ui, "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #entry { padding: 24px; max-width: 620px; }
  #entry h1 { font-size: 20px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  /* Nothing on this page may be mid-grey: that is how the receiver finds the code's rim. */
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid #c8c8c8; border-radius: 4px; background: #fff; color: #111; }
  button { font: inherit; padding: 6px 14px; border: 1px solid #2b2b2b; border-radius: 4px; background: #f3f3f3; color: #111; cursor: pointer; }
  button:hover { background: #e6e6e6; }
  button:disabled { opacity: .5; cursor: default; }
  #err { color: #b00020; min-height: 1.4em; white-space: pre-wrap; }
  #prog { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; display: none; }
  #progbar { height: 100%; width: 0; background: #1976d2; }
  details { margin-top: 14px; } summary { cursor: pointer; }
  #adv label { display: inline-flex; gap: 6px; align-items: center; margin: 6px 14px 0 0; }
  #adv input { width: 60px; }
  #qrmode { position: fixed; inset: 0; }
  #qr { position: fixed; left: 0; top: 0; background: #fff; image-rendering: pixelated; image-rendering: crisp-edges; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: 60px; box-sizing: border-box;
           padding: 6px 12px; display: flex; gap: 16px; align-items: center; background: #fff; border-top: 1px solid #dcdcdc; }
  #idx { width: 110px; font-size: 20px; text-align: right; }
  #lbl { font-size: 16px; font-weight: 600; white-space: nowrap; }
  #meta { color: #3a3a3a; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #banner { display: none; background: #c62828; color: #fff; font-size: 17px; font-weight: 700; padding: 8px 12px; border-radius: 6px; white-space: nowrap; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="entry">
  <h1>GlassTransfer sender</h1>
  <div class="row">
    <input type="text" id="fname" placeholder="file name (same folder as this page)" size="42" autofocus>
    <button id="show">Show</button>
  </div>
  <div id="err"></div>
  <div id="prog"><div id="progbar"></div></div>
  <details>
    <summary>Advanced</summary>
    <div id="adv">
      <label>carrier <select id="mode"><option value="raster">colour raster</option><option value="qr">QR</option></select></label>
      <label>pixels per cell <input type="text" id="px" value="2" inputmode="numeric"></label>
      <label>QR version <input type="text" id="ver" value="40" inputmode="numeric"></label>
      <label>QR ECC <select id="ecc"><option>L</option><option>M</option><option>Q</option><option>H</option></select></label>
    </div>
  </details>
</div>

<div id="qrmode" class="hidden">
  <canvas id="qr" width="1" height="1"></canvas>
  <div id="panel">
    <button id="back">Back</button>
    <input type="text" id="idx" inputmode="numeric" autocomplete="off" spellcheck="false">
    <div id="lbl"></div>
    <div id="meta"></div>
    <div id="banner">Click the chunk field so the receiver's keys reach this page</div>
    <div id="diag" class="hidden"></div>
    <button id="save" class="hidden">Save PNG</button>
  </div>
</div>

"use strict";
var qrcodegen;
(function (qrcodegen) {
    /*---- QR Code symbol class ----*/
    /*
     * A QR Code symbol, which is a type of two-dimension barcode.
     * Invented by Denso Wave and described in the ISO/IEC 18004 standard.
     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
            this.setFunctionModule(8, this.size - 8, true); // Always dark
        }
        // Draws two copies of the version bits (with its own error correction code),
        // based on this object's version field, iff 7 <= version <= 40.
        drawVersion() {
            if (this.version < 7)
                return;
            // Calculate error correction code and pack bits
            let rem = this.version; // version is uint6, in the range [7, 40]
            for (let i = 0; i < 12; i++)
                rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const bits = this.version << 12 | rem; // uint18
            assert(bits >>> 18 == 0);
            // Draw two copies
            for (let i = 0; i < 18; i++) {
                const color = getBit(bits, i);
                const a = this.size - 11 + i % 3;
                const b = Math.floor(i / 3);
                this.setFunctionModule(a, b, color);
                this.setFunctionModule(b, a, color);
            }
        }
        // Draws a 9*9 finder pattern including the border separator,
        // with the center module at (x, y). Modules can be out of bounds.
        drawFinderPattern(x, y) {
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.max(Math.abs(dx), Math.abs(dy)); // Chebyshev/infinity norm
                    const xx = x + dx;
                    const yy = y + dy;
                    if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size)
                        this.setFunctionModule(xx, yy, dist != 2 && dist != 4);
                }
            }
        }
        // Draws a 5*5 alignment pattern, with the center module
        // at (x, y). All modules must be in bounds.
        drawAlignmentPattern(x, y) {
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++)
                    this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
            }
        }
        // Sets the color of a module and marks it as a function module.
        // Only used by the constructor. Coordinates must be in bounds.
        setFunctionModule(x, y, isDark) {
            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }
        /*-- Private helper methods for constructor: Codewords and masking --*/
        // Returns a new byte string representing the given data with the appropriate error correction
        // codewords appended to it, based on this object's version and error correction level.
        addEccAndInterleave(data) {
            const ver = this.version;
            const ecl = this.errorCorrectionLevel;
            if (data.length != QrCode.getNumDataCodewords(ver, ecl))
                throw new RangeError("Invalid argument");
            // Calculate parameter numbers
            const numBlocks = QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
            const blockEccLen = QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
            const rawCodewords = Math.floor(QrCode.getNumRawDataModules(ver) / 8);
            const numShortBlocks = numBlocks - rawCodewords % numBlocks;
            const shortBlockLen = Math.floor(rawCodewords / numBlocks);
            // Split data into blocks and append ECC to each block
            let blocks = [];
            const rsDiv = QrCode.reedSolomonComputeDivisor(blockEccLen);
            for (let i = 0, k = 0; i < numBlocks; i++) {
                let dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks)
                    dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            // Interleave (not concatenate) the bytes from every block into a single sequence
            let result = [];
            for (let i = 0; i < blocks[0].length; i++) {
                blocks.forEach((block, j) => {
                    // Skip the padding byte in short blocks
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks)
                        result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        // Draws the given sequence of 8-bit codewords (data and error correction) onto the entire
        // data area of this QR Code. Function modules need to be marked off before this is called.
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8))
                throw new RangeError("Invalid argument");
            let i = 0; // Bit index into the data
            // Do the funny zigzag scan
            for (let right = this.size - 1; right >= 1; right -= 2) { // Index of right column in each column pair
                if (right == 6)
                    right = 5;
                for (let vert = 0; vert < this.size; vert++) { // Vertical counter
                    for (let j = 0; j < 2; j++) {
                        const x = right - j; // Actual x coordinate
                        const upward = ((right + 1) & 2) == 0;
                        const y = upward ? this.size - 1 - vert : vert; // Actual y coordinate
                        if (!this.isFunction[y][x] && i < data.length * 8) {
                            this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
                            i++;
                        }
                        // If this QR Code has any remainder bits (0 to 7), they were assigned as
                        // 0/false/light by the constructor and are left unchanged by this method
                    }
                }
            }
            assert(i == data.length * 8);
        }
        // XORs the codeword modules in this QR Code with the given mask pattern.
        // The function modules must be marked and the codeword bits must be drawn
        // before masking. Due to the arithmetic of XOR, calling applyMask() with
        // the same mask value a second time will undo the mask. A final well-formed
        // QR Code needs exactly one (not zero, two, etc.) mask applied.
        applyMask(mask) {
            if (mask < 0 || mask > 7)
                throw new RangeError("Mask value out of range");
            for (let y = 0; y < this.size; y++) {
                for (let x = 0; x < this.size; x++) {
                    let invert;
                    switch (mask) {
                        case 0:
                            invert = (x + y) % 2 == 0;
                            break;
                        case 1:
                            invert = y % 2 == 0;
                            break;
                        case 2:
                            invert = x % 3 == 0;
                            break;
                        case 3:
                            invert = (x + y) % 3 == 0;
                            break;
                        case 4:
                            invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 == 0;
                            break;
                        case 5:
                            invert = x * y % 2 + x * y % 3 == 0;
                            break;
                        case 6:
                            invert = (x * y % 2 + x * y % 3) % 2 == 0;
                            break;
                        case 7:
                            invert = ((x + y) % 2 + x * y % 3) % 2 == 0;
                            break;
                        default: throw new Error("Unreachable");
                    }
                    if (!this.isFunction[y][x] && invert)
                        this.modules[y][x] = !this.modules[y][x];
                }
            }
        }
        // Calculates and returns the penalty score based on state of this QR Code's current modules.
        // This is used by the automatic mask choice algorithm to find the mask pattern that yields the lowest score.
        getPenaltyScore() {
            let result = 0;
            // Adjacent modules in row having same color, and finder-like patterns
            for (let y = 0; y < this.size; y++) {
                let runColor = false;
                let runX = 0;
                let runHistory = [0, 0, 0, 0, 0, 0, 0];
                for (let x = 0; x < this.size; x++) {
                    if (this.modules[y][x] == runColor) {
                        runX++;
                        if (runX == 5)
                            result += QrCode.PENALTY_N1;
                        else if (runX > 5)
                            result++;
                    }
                    else {
                        this.finderPenaltyAddHistory(runX, runHistory);
                        if (!runColor)
                            result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runX = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runX, runHistory) * QrCode.PENALTY_N3;
            }
            // Adjacent modules in column having same color, and finder-like patterns
            for (let x = 0; x < this.size; x++) {
                let runColor = false;
                let runY = 0;
                let runHistory = [0, 0, 0, 0, 0, 0, 0];
                for (let y = 0; y < this.size; y++) {
                    if (this.modules[y][x] == runColor) {
                        runY++;
                        if (runY == 5)
                            result += QrCode.PENALTY_N1;
                        else if (runY > 5)
                            result++;
                    }
                    else {
                        this.finderPenaltyAddHistory(runY, runHistory);
                        if (!runColor)
                            result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runY = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runY, runHistory) * QrCode.PENALTY_N3;
            }
            // 2*2 blocks of modules having same color
            for (let y = 0; y < this.size - 1; y++) {
                for (let x = 0; x < this.size - 1; x++) {
                    const color = this.modules[y][x];
                    if (color == this.modules[y][x + 1] &&
                        color == this.modules[y + 1][x] &&
                        color == this.modules[y + 1][x + 1])
                        result += QrCode.PENALTY_N2;
                }
            }
            // Balance of dark and light modules
            let dark = 0;
            for (const row of this.modules)
                dark = row.reduce((sum, color) => sum + (color ? 1 : 0), dark);
            const total = this.size * this.size; // Note that size is odd, so dark/total != 1/2
            // Compute the smallest integer k >= 0 such that (45-5k)% <= dark/total <= (55+5k)%
            const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
            assert(0 <= k && k <= 9);
            result += k * QrCode.PENALTY_N4;
            assert(0 <= result && result <= 2568888); // Non-tight upper bound based on default values of PENALTY_N1, ..., N4
            return result;

/* ---- colour raster -------------------------------------------------------------------- */
// Five colours: black, red, green, blue, white. A cell is read back by which channel dominates

// two bytes ride in seven cells as a base-5 number (5^7 = 78125 > 65535): 2.29 bits a cell.

function rEncode(frame, cols, rows) {

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const entry = $("entry"), qrmode = $("qrmode"), fname = $("fname"), showBtn = $("show"), err = $("err");
const prog = $("prog"), progbar = $("progbar"), canvas = $("qr"), panel = $("panel"), idx = $("idx");
const lbl = $("lbl"), meta = $("meta"), banner = $("banner"), backBtn = $("back"), saveBtn = $("save"), diag = $("diag");
const params = new URLSearchParams(location.search);
const DEBUG = params.get("debug") === "1";
const QUIET = 4;                       // QR quiet zone, in modules
const PANEL_CSS = 60;                  // height of the control strip, in CSS pixels
let state = null;                      // null on the entry screen
let offc = null, offctx = null;

// The five cell colours as packed canvas pixels, in symbol order.
const LE = (() => { const b = new ArrayBuffer(4); new Uint32Array(b)[0] = 1; return new Uint8Array(b)[0] === 1; })();
function pack32(r, g, b) { return (LE ? ((0xFF << 24) | (b << 16) | (g << 8) | r) : ((r << 24) | (g << 16) | (b << 8) | 0xFF)) >>> 0; }

const BLACK32 = PAL32[0], WHITE32 = PAL32[4], GREY32 = pack32(128, 128, 128);

/** How many cells fit beside the control strip, at this many device pixels per cell. */
function chooseGeometry(cellPx) {
  const dpr = window.devicePixelRatio || 1;
  const availW = Math.floor(window.innerWidth * dpr);
  const availH = Math.floor((window.innerHeight - PANEL_CSS) * dpr);
  return { cols: Math.max(8, Math.floor(availW / cellPx) - 2 * R_EDGE),
           rows: Math.max(2, Math.floor(availH / cellPx) - 2 * R_EDGE) };
}

let lastMsg = "none";
function dbg() {
  if (!DEBUG || !state) return;
  diag.classList.remove("hidden");
  diag.textContent = "workers " + state.workers.length + " · cache " + state.cache.size
    + " · pending " + state.pending.size + " · last msg " + lastMsg + " · digest " + (state.digest ? "ready" : "pending");
}
function fail(msg) { meta.textContent = msg; err.textContent = msg; console.error(msg); }
window.addEventListener("error", (e) => fail("Script error: " + e.message + " @ " + (e.filename || "?") + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => fail("Unhandled rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

function clampInt(v, lo, hi, dflt) { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : dflt; }
function fmtBytes(n) { return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB"; }
function fileIdOf(name, size) {
  const nb = new TextEncoder().encode(name), b = new Uint8Array(nb.length + 8); b.set(nb);
  const dv = new DataView(b.buffer); dv.setUint32(nb.length, Math.floor(size / 4294967296)); dv.setUint32(nb.length + 4, size >>> 0);
  return crc32(b);
}
function serverHint() {
  return "This page must be served over HTTP, not opened from disk.\n" +
         "From the folder holding this file run, e.g.:  jwebserver -b 127.0.0.1 -p 8000\n" +
         "then open http://localhost:8000/" + (location.pathname.split("/").pop() || "sender.html");
}

/* ---------- entry screen ---------- */
async function loadFile(name) {
  err.textContent = "";
  name = (name || "").trim();
  if (!name) { err.textContent = "Enter a file name."; return; }
  if (location.protocol === "file:") { err.textContent = serverHint(); return; }
  const cfg = { mode: $("mode").value === "qr" ? "qr" : "raster",
                version: clampInt($("ver").value, 1, 40, 40),
                eclOrd: Math.max(0, ["L", "M", "Q", "H"].indexOf($("ecc").value)),
                cellPx: clampInt($("px").value, 1, 16, 2) };
  if (cfg.mode === "raster") Object.assign(cfg, chooseGeometry(cfg.cellPx));
  const D = carrierCapacity(cfg) - GT_HEADER;
  if (D < 1) {
    err.textContent = cfg.mode === "qr"
      ? "QR version " + cfg.version + " is too small for the frame header; use version 2 or higher."
      : "The window is too small for a raster. Enlarge it, or set fewer pixels per cell.";
    return;
  }
  showBtn.disabled = true;
  try {
    const url = name.split("/").map(encodeURIComponent).join("/");
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) { err.textContent = 'Cannot read "' + name + '": HTTP ' + res.status + " " + res.statusText; return; }
    const len = parseInt(res.headers.get("Content-Length") || "0", 10);
    let buf;
    if (res.body && len > 0) {
      buf = new Uint8Array(len); let off = 0; const reader = res.body.getReader();
      prog.style.display = "block";
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        if (off + value.length > buf.length) { const nb = new Uint8Array(Math.max(buf.length * 2, off + value.length)); nb.set(buf.subarray(0, off)); buf = nb; }
        buf.set(value, off); off += value.length; progbar.style.width = Math.min(100, 100 * off / len).toFixed(1) + "%";
      }
      buf = buf.subarray(0, off);
    } else {
      buf = new Uint8Array(await res.arrayBuffer());
    }

  } catch (e) {
    err.textContent = "Fetch failed: " + (e && e.message ? e.message : e);
  } finally {
    showBtn.disabled = false; prog.style.display = "none"; progbar.style.width = "0";
  }
}
showBtn.addEventListener("click", () => loadFile(fname.value));
fname.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); loadFile(fname.value); } });

/* ---------- QR mode ---------- */
function startSending(name, buf, cfg, D) {
  const size = buf.length, total = Math.ceil(size / D);
  const big = cfg.mode === "raster";

            cache: new Map(), pending: new Set(), current: 0, endCode: null, workers: [], rr: 0, url: null, n: 0,
            lookahead: big ? 4 : 64, cacheMax: big ? 8 : 128 };
  entry.classList.add("hidden"); qrmode.classList.remove("hidden");
  meta.textContent = name + " · " + fmtBytes(size) + " · " + total + " chunk" + (total === 1 ? "" : "s") + " × " + fmtBytes(D)
    + (cfg.mode === "qr" ? " · QR v" + cfg.version + "-" + "LMQH"[cfg.eclOrd]
                         : " · raster " + cfg.cols + "x" + cfg.rows + " cells at " + cfg.cellPx + " px");
  saveBtn.classList.toggle("hidden", !DEBUG);

  spawnWorkers(buf);

function spawnWorkers(buf) {

  if (buf.length > (256 << 20)) n = 1; else if (buf.length > (64 << 20)) n = Math.min(n, 2);
  const src = $("qrlib").textContent + "\n" + $("shared").textContent + "\n" + $("workersrc").textContent;
  state.url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
  const base = { type: "init", D: state.D, fileId: state.fileId, total: state.total, cfg: state.cfg };

    const w = new Worker(state.url);
    w.onmessage = onWorkerMsg;
    w.onerror = (e) => fail("Worker error: " + e.message + " @ " + (e.filename || "?") + ":" + e.lineno);

  if (m.type === "code") {
    state.pending.delete(m.i); cachePut(m.i, m.code);
    if (m.i === state.current) render(m.code);
  } else if (m.type === "digest") {
    state.digest = { crc: m.crc, sha: m.sha };
    if (state.current === state.total) show(state.total);

}

  while (c.size > state.cacheMax) c.delete(c.keys().next().value);

  const c = state.cache, b = c.get(i); if (b) { c.delete(i); c.set(i, b); } return b;
}
function requestFrames(from, to) {
  to = Math.min(to, state.total - 1); if (from > to) return;
  const per = state.workers.map(() => []);
  for (let i = from; i <= to; i++) {
    if (state.cache.has(i) || state.pending.has(i)) continue;
    state.pending.add(i); per[state.rr].push(i); state.rr = (state.rr + 1) % per.length;
  }

function setupCanvas() {
  const dpr = window.devicePixelRatio || 1, cfg = state.cfg;
  let devW, devH, offW, offH;
  if (cfg.mode === "qr") {
    offW = offH = cfg.version * 4 + 17 + 2 * QUIET;
    const m = Math.max(1, Math.round(cfg.cellPx * dpr));   // integer device pixels per module
    devW = devH = offW * m;
    state.n = offW;
  } else {
    offW = cfg.cols + 2 * R_EDGE; offH = cfg.rows + 2 * R_EDGE;
    devW = offW * cfg.cellPx; devH = offH * cfg.cellPx;
  }
  canvas.width = devW; canvas.height = devH;
  canvas.style.width = (devW / dpr) + "px"; canvas.style.height = (devH / dpr) + "px";
  offc = document.createElement("canvas"); offc.width = offW; offc.height = offH;

}
function clearCanvas() {
  const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function render(code) {
  if (state.cfg.mode === "qr") renderQr(code); else renderRaster(code);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offc, 0, 0, canvas.width, canvas.height);

function renderQr(bits) {
  const n = state.n, s = state.cfg.version * 4 + 17;
  const img = offctx.createImageData(n, n), u32 = new Uint32Array(img.data.buffer);
  u32.fill(WHITE32);

    for (let x = 0; x < s; x++) { const b = bitBase + x; if (bits[b >> 3] & (1 << (b & 7))) u32[rowBase + x] = BLACK32; }

/** White quiet zone, grey rim to locate the grid, then one colour per cell. */
function renderRaster(cells) {
  const cfg = state.cfg, w = cfg.cols + 2 * R_EDGE, h = cfg.rows + 2 * R_EDGE;
  const img = offctx.createImageData(w, h), u32 = new Uint32Array(img.data.buffer);
  u32.fill(WHITE32);
  for (let y = R_QUIET; y < h - R_QUIET; y++) {
    const row = y * w, left = row + R_QUIET, right = row + w - R_QUIET;
    if (y < R_QUIET + R_RIM || y >= h - R_QUIET - R_RIM) u32.fill(GREY32, left, right);
    else { u32.fill(GREY32, left, left + R_RIM); u32.fill(GREY32, right - R_RIM, right); }

  state.current = i;

  if (i === state.total) {
    document.title = "GT END"; lbl.textContent = "END (" + state.total + " chunks)";
    if (state.digest === null) { clearCanvas(); lbl.textContent += " – computing checksums…"; return; }
    if (!state.endCode) state.endCode = encodeCarrier(state.cfg,
      buildEndFrame(state.size, state.digest.crc, state.digest.sha, state.name, state.fileId, state.total, state.D));
    render(state.endCode);

  document.title = "GT " + pct + "% " + i + "/" + state.total;
  lbl.textContent = "chunk " + i + " / " + state.total + "  (" + pct + "%)";
  let b = cacheGet(i);
  if (!b) { b = encodeCarrier(state.cfg, buildDataFrame(state.buf, i, state.D, state.fileId, state.total)); cachePut(i, b); }
  render(b);                                                       // a code is always on screen after a key

document.addEventListener("keydown", (e) => {
  if (!state) return;
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault(); if (e.repeat) return;
    show(state.current + (e.key === "ArrowUp" ? 1 : -1));
  } else if (e.key === "Enter") {
    e.preventDefault();
    const v = parseInt(idx.value, 10);
    if (Number.isFinite(v)) show(v); else { idx.value = String(state.current); idx.select(); }
  } else if (e.target !== idx && /^[0-9]$/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault(); idx.focus({ preventScroll: true }); idx.value = e.key;
  }
}, true);

function updateBanner() {
  if (!state) { banner.style.display = "none"; return; }
  const ok = document.hasFocus() && document.activeElement === idx && !document.hidden;
  banner.style.display = ok ? "none" : "block";
}
for (const ev of ["focus", "blur"]) { idx.addEventListener(ev, updateBanner); window.addEventListener(ev, updateBanner); }
document.addEventListener("visibilitychange", updateBanner);
document.addEventListener("mousedown", (e) => {
  if (state && e.target !== backBtn && e.target !== saveBtn) setTimeout(() => { idx.focus({ preventScroll: true }); idx.select(); }, 0);
});

function watchDpr() {
  const mq = matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
  mq.addEventListener("change", () => { if (state) { setupCanvas(); show(state.current); } watchDpr(); }, { once: true });
}
watchDpr();

function back() {
  if (!state) return;
  for (const w of state.workers) w.terminate();
  if (state.url) URL.revokeObjectURL(state.url);
  state.buf = null; state.cache.clear();
  state = null;
  qrmode.classList.add("hidden"); entry.classList.remove("hidden");
  banner.style.display = "none"; document.title = "GlassTransfer sender";
  fname.focus(); fname.select();
}
backBtn.addEventListener("click", back);
saveBtn.addEventListener("click", () => {
  if (!state) return;
  canvas.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = "gt_" + state.cfg.mode + "_" + (state.current === state.total ? "END" : state.current) + ".png";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, "image/png");
});

/* ---------- URL parameters: ?file=name&px=4&ver=40&ecc=L&debug=1 ---------- */
if (params.get("mode")) $("mode").value = params.get("mode");
if (params.get("px")) $("px").value = params.get("px");
if (params.get("ver")) $("ver").value = params.get("ver");
if (params.get("ecc")) $("ecc").value = params.get("ecc").toUpperCase();
if (params.get("file")) { fname.value = params.get("file"); loadFile(fname.value); }
</script>
</body>
</html>
